# Security headers for every response.
# Nginx does not inherit add_header into a location block that sets its own
# headers, so include this file in the server block and in every such location.
# The pages in public/ repeat the Content-Security-Policy in a <meta> element
# for GitHub Pages, without frame-ancestors; scripts/check_page_security.py
# keeps them identical.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
