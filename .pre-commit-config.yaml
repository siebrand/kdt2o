repos:
  - repo: local
    hooks:
      - id: validate-recipes
        name: Validate public/recipes.json
        entry: python scripts/validate_recipes.py
        language: python
        additional_dependencies: ["jsonschema>=4.18"]
        files: ^(public/recipes\.json|schemas/schema\.json|scripts/validate_recipes\.py)$
        pass_filenames: false
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-docker
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
