    <circle cx="22" cy="132" r="20" fill="#d9584d" stroke="#174c45" stroke-width="6"/>
    <circle cx="165" cy="137" r="18" fill="#d9584d" stroke="#174c45" stroke-width="6"/>
    <g fill="#f7d59a"><ellipse cx="-25" cy="160" rx="6" ry="12"/><ellipse cx="48" cy="184" rx="6" ry="12"/><ellipse cx="118" cy="173" rx="6" ry="12"/><ellipse cx="202" cy="170" rx="6" ry="12"/></g>
  </g>
  <text x="1180" y="390" fill="#174c45" font-family="Arial, sans-serif" font-size="22" font-weight="700">Knapperig · fris · vezelrijk</text>
