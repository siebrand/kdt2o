version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      browser-libraries:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:40"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      pre-commit-hooks:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github/security
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      security-tools:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Amsterdam
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      test-dependencies:
        patterns:
          - "*"
