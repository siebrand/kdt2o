name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag for a rollback deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify rollback version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release.py verify --version "$VERSION" --ref "$VERSION"

      - name: Check out rollback source
        if: ${{ inputs.version != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          path: rollback-source
          fetch-depth: 1
          persist-credentials: false

      - name: Stamp application version
        id: deployment-source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            source_dir=rollback-source/public
            python scripts/release.py version --ref "$VERSION" > "$source_dir/version.txt"
          else
            source_dir=public
            python scripts/release.py version > public/version.txt
          fi
          echo "path=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.deployment-source.outputs.path }}

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
