name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag for a rollback deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify rollback version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release.py verify --version "$VERSION" --ref "$VERSION"

      - name: Check out rollback source
        if: ${{ inputs.version != '' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          path: rollback-source
          fetch-depth: 1

      - name: Stamp application version
        id: deployment-source
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$VERSION" ]]; then
            source_dir=rollback-source/public
            python scripts/release.py version --ref "$VERSION" > "$source_dir/version.txt"
          else
            source_dir=public
            python scripts/release.py version > public/version.txt
          fi
          echo "path=$source_dir" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ steps.deployment-source.outputs.path }}

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
