name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Optional version tag for a rollback deployment
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out deployment source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.sha }}
          fetch-depth: 0

      - name: Verify rollback version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: python scripts/release.py verify --version "$VERSION"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
