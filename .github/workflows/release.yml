name: Publish release

on:
  push:
    tags:
      - '2*.*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify version tag
        id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python scripts/release.py verify --version "$VERSION"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Stamp application version
        run: python scripts/release.py version > public/version.txt
      - name: Generate release notes from the canonical changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: python scripts/release.py notes --version "$VERSION" > release-notes.md
      - name: Build container for the release
        env:
          VERSION: ${{ github.ref_name }}
        run: docker build --tag "kitano-meal-planner:$VERSION" .
      - name: Generate SPDX SBOM for the container
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: kitano-meal-planner:${{ steps.version.outputs.value }}
          format: spdx-json
          output-file: sbom.spdx.json
          syft-version: v1.57.2
          upload-artifact: "false"
          upload-release-assets: "false"
      - name: Create and publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION" --verify-tag
          --title "Versie $VERSION" --notes-file release-notes.md sbom.spdx.json
