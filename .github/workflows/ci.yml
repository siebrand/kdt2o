name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependency
        run: python -m pip install pypdf==5.4.0
      - name: Run parser tests
        run: python -m unittest discover -s tests
      - name: Validate recipe extraction
        run: python scripts/extract_recipes.py recipes /tmp/recipes.json
      - name: Build container
        run: docker build --tag kitano-meal-planner:ci .
