server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # Pages, scripts, styles, and data are always revalidated, so a browser never
  # combines a new page with an old script; an unchanged file costs only a 304
  # response thanks to its ETag. Locations without add_header inherit this.
  add_header Cache-Control "no-cache" always;

  # HTML is compressed by default; also compress the text assets. recipes.json
  # shrinks to about a sixth of its size.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css text/plain image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:png|svg|ico|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
