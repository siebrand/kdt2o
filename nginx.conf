server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  # HTML is compressed by default; also compress the text assets. recipes.json
  # shrinks to about a sixth of its size.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/javascript application/json text/css text/plain image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /recipes.json {
    include /etc/nginx/snippets/security-headers.conf;
    # Always revalidate, so a recipe change is visible at once; an unchanged
    # file costs only a 304 response thanks to its ETag.
    add_header Cache-Control "no-cache" always;
  }

  location ~* \.(?:js|css|png|svg|woff2)$ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
  }
}
